        .returnTop {

        .returnTop.show {

        .returnTop:hover {

        }

        .heart {

            width: 10px;
            height: 10px;
            background: #ff5e94;
            transform: rotate(45deg);
            z-index: 9999;
            pointer-events: none;
        }

        .heart:after,
        .heart:before {
            content: '';
            width: inherit;
            height: inherit;
            background: inherit;
            border-radius: 50%;
            position: absolute;
        }

        .heart:after {
            top: -5px;
        }

    <script>

        // 返回顶部
        const returnBtn = document.getElementById('returnTop');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 300) {
                returnBtn.classList.add('show');
            } else {
                returnBtn.classList.remove('show');
            }
        });
        returnBtn.addEventListener('click', () => {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        // 点击爱心特效
        (function(e, t) {
            let hearts = [];
            const createHeart = (x, y) => {
                const heart = document.createElement('div');
                heart.className = 'heart';
                const color = `rgb(${Math.random()*255},${Math.random()*150+100},${Math.random()*255})`;
                heart.style.background = color;
                heart.style.left = x - 5 + 'px';
                heart.style.top = y - 5 + 'px';
                t.body.appendChild(heart);
                
                let opacity = 1;
                let scale = 1;
                let posY = y;
                
                const remove = () => { heart.remove(); hearts = hearts.filter(h => h.el !== heart); };
                const animate = () => {
                    if (opacity <= 0) return remove();
                    posY -= 1.5;
                    scale += 0.008;
                    opacity -= 0.015;
                    heart.style.top = posY + 'px';
                    heart.style.opacity = opacity;
                    heart.style.transform = `scale(${scale}) rotate(45deg)`;
                    requestAnimationFrame(animate);
                };
                animate();
                hearts.push({ el: heart });
            };
            t.addEventListener('click', (e) => { createHeart(e.clientX, e.clientY); });
        })(window, document);

        // 樱花特效
        let img = new Image();
        img.src = 'https://cdn.jsdelivr.net/gh/macagic/macagic.github.io/img/sakura.png';
        img.crossOrigin = "anonymous";
        
        window.addEventListener('load', () => {
            if (img.complete) startSakura();
            else img.onload = startSakura;
        });

        function startSakura() {
            const canvas = document.createElement('canvas');
            canvas.id = 'canvas_sakura';
            canvas.style.cssText = 'position:fixed;left:0;top:0;pointer-events:none;z-index:10';
            document.body.appendChild(canvas);
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            class Sakura {
                constructor() {
                    this.x = Math.random() * canvas.width;
                    this.y = Math.random() * canvas.height;
                    this.size = Math.random() * 0.6 + 0.4;
                    this.rotate = Math.random() * 6;
                    this.speedX = Math.random() * 1 - 0.5;
                    this.speedY = Math.random() * 1 + 0.5;
                }
                update() {
                    this.x += this.speedX;
                    this.y += this.speedY;
                    this.rotate += 0.01;
                    if (this.y > canvas.height) this.y = 0;
                    if (this.x > canvas.width) this.x = 0;
                    if (this.x < 0) this.x = canvas.width;
                }
                draw() {
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    ctx.rotate(this.rotate);
                    ctx.drawImage(img, -20 * this.size, -20 * this.size, 40 * this.size, 40 * this.size);
                    ctx.restore();
                }
            }

            const sakuras = Array.from({ length: 40 }, () => new Sakura());
            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                sakuras.forEach(s => { s.update(); s.draw(); });
                requestAnimationFrame(animate);
            }
            animate();

            window.addEventListener('resize', () => {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            });
        }

        // ==================================
        // 纯原生计时 —— 不依赖任何外部文件
        // ==================================
        function showLoveTime() {
            // ✅ 在这里修改你们的相识时间
            var startDate = new Date("2026-05-17 20:31:00");
            var nowDate = new Date();
            
            var diff = nowDate - startDate;

            var days = Math.floor(diff / (1000 * 60 * 60 * 24));
            var hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            var minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            var seconds = Math.floor((diff % (1000 * 60)) / 1000);

            hours = hours < 10 ? "0" + hours : hours;
            minutes = minutes < 10 ? "0" + minutes : minutes;
            seconds = seconds < 10 ? "0" + seconds : seconds;

            document.getElementById("d").innerText = days;
            document.getElementById("h").innerText = hours;
            document.getElementById("m").innerText = minutes;
            document.getElementById("s").innerText = seconds;
        }
        
        showLoveTime();
        setInterval(showLoveTime, 1000);
    </script>
